name: Verify website and Android assets
on:
  pull_request:
  push:
    branches:
      - main
      - 'fix/**'
      - 'feature/**'
jobs:
  web-and-capacitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify website and bundled assets
        run: npm run check
      - name: Install Capacitor
        run: npm install --no-audit --no-fund
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package.json') }}
      # The runner image already has Chromium's system libraries. Installing them with
      # --with-deps goes through apt, whose mirror sometimes stalls for ~10 minutes, so
      # only fall back to apt when Chromium cannot actually launch.
      - name: Install headless Chromium
        run: |
          npx playwright install chromium
          if ! node -e "require('playwright').chromium.launch().then(b=>b.close()).catch(e=>{console.error(e.message);process.exit(1)})"; then
            echo "Chromium could not launch; installing system dependencies with apt"
            npx playwright install-deps chromium
          fi
      - name: Smoke-test source website and packaged Android webview
        run: npm run smoke:web
      - name: Create Android project from the same web bundle
        run: |
          npx cap add android
          npx cap sync android
          test -s android/app/src/main/assets/public/index.html
          test -s android/app/src/main/assets/public/app.js
          test -s android/app/src/main/assets/public/styles.css
          test -s android/app/src/main/assets/public/genesis.js
          test -s android/app/src/main/assets/public/genesis.css
          test -s android/app/src/main/assets/public/data/bible.json

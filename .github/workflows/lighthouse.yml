name: Lighthouse (warn only)
# Informational: scores and warnings never block a merge.
on:
  pull_request:
jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Lighthouse CI (phone, 390px)
        continue-on-error: true
        run: npx --yes @lhci/cli@0.15.x autorun
      - name: Summary
        if: always()
        run: |
          if ls lighthouse-report/manifest.json >/dev/null 2>&1; then
            node -e "const m=require('./lighthouse-report/manifest.json');let s='## Lighthouse (phone, warn only)\n|Page|Perf|A11y|Best|SEO|\n|-|-|-|-|-|\n';for(const r of m){const c=r.summary;s+='|'+r.url.replace(/^https?:\/\/[^/]+/,'')+'|'+[c.performance,c.accessibility,c['best-practices'],c.seo].map(x=>Math.round(x*100)).join('|')+'|\n';}require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY,s);console.log(s)"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: lighthouse-report/
          retention-days: 14
          if-no-files-found: ignore

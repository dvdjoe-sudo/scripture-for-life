name: Publish to Google Play
# INACTIVE until the repo has these secrets (see docs/BUILD-TOOLS.md):
#   PLAY_SERVICE_ACCOUNT_JSON, UPLOAD_KEYSTORE_BASE64, UPLOAD_KEYSTORE_PASSWORD, UPLOAD_KEY_ALIAS, UPLOAD_KEY_PASSWORD
# Runs only when started by hand (Actions > Publish to Google Play > Run workflow).
# Uploads a signed app bundle as a DRAFT release on the chosen track.
# Pull requests that change this setup only check that the Gradle config loads; they upload nothing.
on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Play track'
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
  pull_request:
    paths:
      - '.github/workflows/play-publish.yml'
      - 'scripts/android-play-publisher.mjs'
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check secrets
        if: github.event_name == 'workflow_dispatch'
        env:
          SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          KS: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SA" ] || [ -z "$KS" ]; then
            echo "::error::Play publishing is not set up yet. Add PLAY_SERVICE_ACCOUNT_JSON and the upload keystore secrets (docs/BUILD-TOOLS.md)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Create Android project and add Play Publisher
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          npm run android:sync
          node scripts/android-play-publisher.mjs
      - name: Check the Play Publisher config loads (no upload)
        if: github.event_name == 'pull_request'
        working-directory: android
        run: ./gradlew :app:tasks --group publishing --console=plain
      - name: Build signed bundle and upload draft to Google Play
        if: github.event_name == 'workflow_dispatch'
        working-directory: android
        env:
          SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          KS: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          PLAY_TRACK: ${{ inputs.track }}
          PLAY_VERSION_CODE: ${{ github.run_number }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/play.json"
          printf '%s' "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"
          export PLAY_CREDENTIALS_PATH="$RUNNER_TEMP/play.json" UPLOAD_KEYSTORE_PATH="$RUNNER_TEMP/upload.jks"
          ./gradlew publishReleaseBundle --console=plain
          rm -f "$RUNNER_TEMP/play.json" "$RUNNER_TEMP/upload.jks"

name: Build test Android APK

on:
  push:
    branches:
      - android-apk-test
    paths-ignore:
      - 'apk-out/**'
  pull_request:
    paths:
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Install dependencies and create Android project
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          npm run android:sync
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --console=plain
      - name: Commit the APK back to this branch
        if: github.event_name == 'push'
        run: |
          mkdir -p apk-out
          cp android/app/build/outputs/apk/debug/app-debug.apk apk-out/scripture-for-life-test.apk
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add apk-out/scripture-for-life-test.apk
          git commit -m "Test APK build [apk-out]"
          git push origin HEAD:android-apk-test

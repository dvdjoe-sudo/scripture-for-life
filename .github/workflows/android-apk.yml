name: Build test Android APK

on:
  push:
    branches:
      - android-apk-test
    paths-ignore:
      - 'apk-out/**'
  pull_request:
    paths:
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Install dependencies and create Android project
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          npm run android:sync
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --console=plain
      - name: Publish the APK as the test-apk GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk scripture-for-life-test.apk
          gh release delete test-apk --cleanup-tag -y || true
          gh release create test-apk scripture-for-life-test.apk --target "$GITHUB_SHA" --prerelease --title "Test APK" --notes "Debug test build from android-apk-test ($GITHUB_SHA)."
